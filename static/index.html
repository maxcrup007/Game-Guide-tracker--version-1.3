<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games & Hobbies — My Collection</title>
<link rel="stylesheet" href="shared.css">
<style>
  .filters-bar { display:flex; gap:8px; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
  .filters-bar input,.filters-bar select { padding:9px 14px; border:1px solid var(--border2); border-radius:var(--radius-md); background:var(--surface); color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:border-color .15s; }
  .filters-bar input { flex:1; min-width:200px; }
  .filters-bar input:focus,.filters-bar select:focus { border-color:var(--orange); }
  .filters-bar select option { background:var(--surface2); }
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:2rem; }
  .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .game-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.25rem; position:relative; transition:border-color .2s,transform .2s,box-shadow .2s; }
  .game-card:hover { border-color:var(--orange); transform:translateY(-3px); box-shadow:0 8px 30px rgba(249,115,22,0.12); }
  .card-fav { position:absolute; top:12px; right:12px; background:none; border:none; font-size:18px; cursor:pointer; opacity:0.3; transition:opacity .15s,transform .15s; line-height:1; color:var(--orange); }
  .card-fav.on { opacity:1; }
  .card-fav:hover { opacity:0.9; transform:scale(1.2); }
  .card-title { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; margin-bottom:6px; padding-right:28px; color:var(--text); line-height:1.3; }
  .card-notes { font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .btn-more { background:none; border:none; font-size:12px; color:var(--orange); cursor:pointer; padding:0; margin-bottom:10px; font-weight:500; }
  .card-date { font-size:11px; color:var(--hint); margin-bottom:12px; }
  .card-actions { display:flex; gap:6px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .card-actions button,.card-actions label { font-size:11px; padding:5px 11px; border-radius:var(--radius-sm); border:1px solid var(--border2); background:none; color:var(--muted); cursor:pointer; transition:all .12s; font-family:inherit; }
  .card-actions button:hover,.card-actions label:hover { background:var(--surface2); color:var(--text); }
  .card-actions .btn-del { color:var(--danger); border-color:rgba(239,68,68,0.25); }
  .card-actions .btn-del:hover { background:var(--danger-bg); }
  .badge-MineCraft              { background:rgba(22,161,4,0.15);   color:#4ade80; border:1px solid rgba(22,161,4,0.3); }
  .badge-Monster-Hunter-Wild    { background:rgba(241,245,18,0.12); color:#facc15; border:1px solid rgba(241,245,18,0.3); }
  .badge-ARK-Survival-Ascended  { background:rgba(6,10,226,0.15);  color:#818cf8; border:1px solid rgba(6,10,226,0.35); }
  .badge-Red-Dead-Redemption-2  { background:rgba(235,12,12,0.13); color:#f87171; border:1px solid rgba(235,12,12,0.3); }
  .badge-ELDEN-RING             { background:rgba(231,161,11,0.15);color:#fbbf24; border:1px solid rgba(231,161,11,0.3); }
  .badge-FateGO                 { background:rgba(13,114,207,0.15);color:#60a5fa; border:1px solid rgba(13,114,207,0.3); }
  .empty-state { text-align:center; padding:5rem 1rem; color:var(--hint); font-size:14px; grid-column:1/-1; }
  .empty-state .icon { font-size:48px; margin-bottom:1rem; opacity:0.4; }
  .ann-bar { background:var(--orange-bg); border:1px solid rgba(249,115,22,0.25); border-radius:var(--radius-md); padding:12px 16px; margin-bottom:1.5rem; font-size:13px; display:flex; align-items:flex-start; gap:10px; }
  .ann-bar-title { font-weight:600; color:var(--orange); margin-bottom:2px; }
  .ann-bar-body  { color:var(--muted); font-size:12px; }
  .detail-overlay-fs { position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; flex-direction:column; overflow:hidden; }
  .detail-topbar { display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; height:60px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; gap:12px; }
  .detail-topbar-left { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .detail-topbar-left h2 { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .detail-meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .detail-close { background:var(--surface2); color:var(--text); border:1px solid var(--border2); border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; padding:7px 16px; font-family:inherit; transition:all .15s; flex-shrink:0; }
  .detail-close:hover { background:var(--surface3); }
  .detail-actions { display:flex; gap:8px; padding:10px 1.5rem; background:var(--bg2); border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0; }
  .detail-actions a,.detail-actions button,.detail-actions label { font-size:12px; padding:7px 15px; border-radius:var(--radius-md); border:1px solid var(--border2); background:var(--surface); color:var(--muted); cursor:pointer; text-decoration:none; display:inline-block; transition:all .15s; font-family:inherit; font-weight:500; }
  .detail-actions a:hover,.detail-actions button:hover,.detail-actions label:hover { background:var(--surface2); color:var(--text); }
  .detail-actions .btn-stackedit { background:var(--orange); color:#fff; border-color:var(--orange); font-weight:600; }
  .detail-actions .btn-stackedit:hover { background:var(--orange-dim); color:#fff; }
  .md-preview { flex:1; overflow-y:auto; padding:2.5rem; max-width:820px; margin:0 auto; width:100%; font-size:15px; line-height:1.9; color:var(--text); }
  .md-preview h1 { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; margin:2rem 0 0.75rem; }
  .md-preview h2 { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:1.75rem 0 0.6rem; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .md-preview h3 { font-size:16px; font-weight:600; margin:1.5rem 0 0.5rem; color:var(--orange); }
  .md-preview p  { margin-bottom:1rem; color:var(--muted); }
  .md-preview ul,.md-preview ol { padding-left:1.75rem; margin-bottom:1rem; color:var(--muted); }
  .md-preview li { margin-bottom:0.4rem; }
  .md-preview code { background:var(--surface2); border:1px solid var(--border2); padding:2px 7px; border-radius:5px; font-family:monospace; font-size:13px; color:var(--orange); }
  .md-preview pre { background:var(--surface2); border:1px solid var(--border); padding:1.25rem; border-radius:var(--radius-md); overflow-x:auto; margin-bottom:1rem; }
  .md-preview pre code { background:none; border:none; padding:0; color:var(--text); }
  .md-preview blockquote { border-left:3px solid var(--orange); padding:0.75rem 1.25rem; color:var(--muted); margin-bottom:1rem; background:var(--orange-bg); border-radius:0 var(--radius-md) var(--radius-md) 0; }
  .md-preview strong { font-weight:600; color:var(--text); }
  .md-preview em { font-style:italic; }
  .md-preview hr { border:none; border-top:1px solid var(--border); margin:2rem 0; }
  .md-preview a { color:var(--orange); }
  .md-preview table { border-collapse:collapse; width:100%; margin-bottom:1rem; }
  .md-preview th { background:var(--surface2); color:var(--text); font-weight:600; padding:10px 14px; border:1px solid var(--border2); text-align:left; }
  .md-preview td { padding:9px 14px; border:1px solid var(--border); color:var(--muted); }
  .md-preview tr:nth-child(even) td { background:var(--surface); }
  .md-preview img { max-width:100%; border-radius:var(--radius-lg); margin:1rem 0; display:block; border:1px solid var(--border); }
  #md-upload { display:none; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-brand">🎮 Games<span>&amp;</span>Hobbies</a>
    <div class="navbar-links">
      <a href="index.html"   class="nav-link active">My Collection</a>
      <a href="request.html" class="nav-link">Request</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
    <div class="navbar-right">
      <button class="btn-primary" onclick="openModal()" style="padding:8px 16px;font-size:12px">+ Add item</button>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div id="ann-container"></div>
  <div style="margin-bottom:2rem">
    <div class="accent-line"></div>
    <h1 style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-bottom:6px">My Collection</h1>
    <p style="color:var(--muted);font-size:14px">Track every game and hobby you love</p>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total items</div><div class="stat-val" id="st-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Categories</div><div class="stat-val" id="st-cats">—</div></div>
    <div class="stat-card"><div class="stat-label">Favorites</div><div class="stat-val" id="st-favs">—</div></div>
  </div>
  <div class="filters-bar">
    <input type="text" id="search" placeholder="🔍  Search title or notes…" oninput="load()">
    <select id="fcat" onchange="load()">
      <option value="">All categories</option>
      <option>MineCraft</option><option>Monster Hunter Wild</option>
      <option>ARK Survival Ascended</option><option>Red Dead Redemption 2</option>
      <option>ELDEN RING</option><option>FateGO</option>
    </select>
    <select id="fsort" onchange="load()">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="az">A → Z</option>
    </select>
    <select id="ffav" onchange="load()">
      <option value="">All items</option>
      <option value="true">⭐ Favorites only</option>
    </select>
  </div>
  <div class="cards-grid" id="grid"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay" style="display:none">
  <div class="modal">
    <h2 id="modal-title">Add new item</h2>
    <div class="field"><label>Title *</label><input id="f-title" placeholder="e.g. Elden Ring, Guitar, Chess"></div>
    <div class="field"><label>Category</label>
      <select id="f-cat">
        <option>MineCraft</option><option>Monster Hunter Wild</option>
        <option>ARK Survival Ascended</option><option>Red Dead Redemption 2</option>
        <option>ELDEN RING</option><option>FateGO</option>
      </select>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Tips, goals, thoughts… supports Markdown"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- Full-screen detail -->
<div class="detail-overlay-fs" id="detail-overlay" style="display:none">
  <div style="display:flex;flex-direction:column;height:100%">
    <div class="detail-topbar">
      <div class="detail-topbar-left">
        <h2 id="detail-title">—</h2>
        <div class="detail-meta">
          <span class="badge" id="detail-badge"></span>
          <span style="font-size:12px;color:var(--hint)" id="detail-date"></span>
        </div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕ Close</button>
    </div>
    <div class="detail-actions">
      <a id="btn-stackedit" class="btn-stackedit" target="_blank" href="#">Open in StackEdit ↗</a>
      <label for="md-upload">Upload .md</label>
      <input type="file" id="md-upload" accept=".md,.markdown" onchange="uploadMd(event)">
      <button onclick="copyMd()">Copy markdown</button>
      <button onclick="downloadMd()">Download .md</button>
    </div>
    <div class="md-preview" id="md-preview"></div>
  </div>
</div>

<footer>
  <p>Games &amp; Hobbies Tracker &nbsp;·&nbsp; <a href="contact.html">Contact us</a> &nbsp;·&nbsp; <a href="request.html">Request a game</a></p>
</footer>
<div class="toast" id="toast"></div>

<script>
const API='/api/items'; let editingId=null,detailItem=null;
function slugify(c){return c.replace(/\s+/g,'-');}
function fmt(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

async function load(){
  const p=new URLSearchParams({search:document.getElementById('search').value,category:document.getElementById('fcat').value,sort:document.getElementById('fsort').value,favorite:document.getElementById('ffav').value});
  const items=await fetch(`${API}?${p}`).then(r=>r.json());
  renderGrid(items); updateStats();
}
function renderGrid(items){
  const g=document.getElementById('grid');
  if(!items.length){g.innerHTML='<div class="empty-state"><div class="icon">🎮</div><p>No items found.</p></div>';return;}
  g.innerHTML=items.map(x=>`
    <div class="game-card">
      <button class="card-fav ${x.favorite?'on':''}" onclick="toggleFav(${x.id},${x.favorite})">${x.favorite?'★':'☆'}</button>
      <div style="margin-bottom:10px"><span class="badge badge-${slugify(x.category)}">${esc(x.category)}</span></div>
      <div class="card-title">${esc(x.title)}</div>
      <div class="card-notes">${esc(x.notes)||'<em style="opacity:.4">No notes yet.</em>'}</div>
      ${x.notes?`<button class="btn-more" onclick="openDetail(${x.id})">Read more →</button>`:''}
      <div class="card-date">Added ${fmt(x.created_at)}</div>
      <div class="card-actions">
        <button onclick="editItem(${x.id})">Edit</button>
        <label for="cup-${x.id}">Upload .md</label>
        <input type="file" id="cup-${x.id}" accept=".md,.markdown" style="display:none" onchange="cardUploadMd(event,${x.id})">
        <button class="btn-del" onclick="deleteItem(${x.id})">Delete</button>
      </div>
    </div>`).join('');
}
function updateStats(){
  fetch(API).then(r=>r.json()).then(all=>{
    document.getElementById('st-total').textContent=all.length;
    document.getElementById('st-cats').textContent=new Set(all.map(x=>x.category)).size;
    document.getElementById('st-favs').textContent=all.filter(x=>x.favorite).length;
  });
}
async function loadAnnouncements(){
  try{const a=await fetch('/api/announcements').then(r=>r.json());
  document.getElementById('ann-container').innerHTML=a.map(x=>`<div class="ann-bar"><div>📢</div><div><div class="ann-bar-title">${esc(x.title)}</div>${x.body?`<div class="ann-bar-body">${esc(x.body)}</div>`:''}</div></div>`).join('');}catch(e){}
}
function editItem(id){openModal(id);}
function openModal(id=null){
  editingId=id;
  document.getElementById('modal-title').textContent=id?'Edit item':'Add new item';
  document.getElementById('f-title').value='';document.getElementById('f-cat').value='MineCraft';document.getElementById('f-notes').value='';
  if(id){fetch(`${API}/${id}`).then(r=>r.json()).then(x=>{document.getElementById('f-title').value=x.title;document.getElementById('f-cat').value=x.category;document.getElementById('f-notes').value=x.notes;});}
  document.getElementById('overlay').style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),50);
}
function closeModal(){document.getElementById('overlay').style.display='none';editingId=null;}
async function saveItem(){
  const title=document.getElementById('f-title').value.trim();if(!title){alert('Title required');return;}
  const payload={title,category:document.getElementById('f-cat').value,notes:document.getElementById('f-notes').value};
  if(editingId){await fetch(`${API}/${editingId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast('Updated!');}
  else{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast('Added!');}
  closeModal();load();
}
async function deleteItem(id){if(!confirm('Delete?'))return;await fetch(`${API}/${id}`,{method:'DELETE'});toast('Deleted.');load();}
async function toggleFav(id,cur){await fetch(`${API}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({favorite:!cur})});load();}

function openDetail(id){
  fetch(`${API}/${id}`).then(r=>r.json()).then(x=>{
    detailItem=x;
    document.getElementById('detail-title').textContent=x.title;
    document.getElementById('detail-date').textContent='Added '+fmt(x.created_at);
    const b=document.getElementById('detail-badge');b.textContent=x.category;b.className='badge badge-'+slugify(x.category);
    renderMarkdown(x.notes||'');
    document.getElementById('btn-stackedit').href='https://stackedit.io/app#'+btoa(unescape(encodeURIComponent('# '+x.title+'\n\n'+(x.notes||''))));
    document.getElementById('detail-overlay').style.display='flex';document.body.style.overflow='hidden';
  });
}
function closeDetail(){document.getElementById('detail-overlay').style.display='none';document.body.style.overflow='';detailItem=null;}

function renderMarkdown(md){
  let h=md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---$/gm,'<hr>').replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^\s*[-*] (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>')
    .split(/\n{2,}/).map(b=>{
      if(/^<(h[1-3]|hr|blockquote|li|ul|ol|img)/.test(b.trim()))return b;
      if(b.trim()==='')return'';
      if(b.includes('<li>'))return'<ul>'+b+'</ul>';
      return'<p>'+b.replace(/\n/g,'<br>')+'</p>';
    }).join('\n');
  document.getElementById('md-preview').innerHTML=h||'<em style="opacity:.4">No notes yet.</em>';
}
function uploadMd(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{if(!detailItem)return;fetch(`${API}/${detailItem.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:ev.target.result})}).then(()=>{detailItem.notes=ev.target.result;renderMarkdown(ev.target.result);toast('Uploaded & saved!');load();});};r.readAsText(f);e.target.value='';}
function copyMd(){if(!detailItem)return;navigator.clipboard.writeText(detailItem.notes||'').then(()=>toast('Copied!'));}
function downloadMd(){if(!detailItem)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([detailItem.notes||''],{type:'text/markdown'}));a.download=detailItem.title.replace(/\s+/g,'_')+'.md';a.click();}
function cardUploadMd(e,id){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{fetch(`${API}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:ev.target.result})}).then(()=>{toast('Uploaded!');load();});};r.readAsText(f);e.target.value='';}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('detail-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDetail();}});
loadAnnouncements(); load();
</script>
</body>
</html>
